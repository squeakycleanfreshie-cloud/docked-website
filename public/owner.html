<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docked — Owner Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101110;
      --panel: #191b19;
      --line: #303330;
      --text: #f2f3ef;
      --muted: #a1a69f;
      --accent: #d9ff78;
      --red: #ff7777;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 22px max(20px, calc((100vw - 1100px) / 2));
      border-bottom: 1px solid var(--line);
    }

    a { color: var(--accent); overflow-wrap: anywhere; }

    .brand { font-weight: 850; font-size: 22px; letter-spacing: -1px; }
    .brand span { color: var(--accent); }
    .subtle { color: var(--muted); font-size: 13px; }

    main { max-width: 1100px; padding: 30px 20px 70px; margin: auto; }
    h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -1.5px; margin: 0; }
    h2 { font-size: 21px; margin: 0 0 12px; }
    h3 { font-size: 18px; margin: 0; }
    p { overflow-wrap: anywhere; }

    .intro { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 24px; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 22px 0; }
    .stat, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 15px; }
    .stat { padding: 16px; }
    .stat strong { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 12px; }

    .tabs, .filters, .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .tabs { border-bottom: 1px solid var(--line); margin: 28px 0 20px; }
    button, input, textarea, select {
      font: inherit; border: 1px solid var(--line); border-radius: 9px;
      padding: 10px 12px; color: var(--text); background: #121412;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.active, .primary { background: var(--accent); color: #11130e; border-color: var(--accent); font-weight: 750; }
    button.danger { color: var(--red); }
    button:disabled { opacity: .5; cursor: wait; }

    .filters { margin: 16px 0; }
    .filters input { flex: 1; min-width: 200px; }
    .list { display: grid; gap: 14px; }

    .card { padding: 20px; min-width: 0; }
    .card-head { display: flex; justify-content: space-between; align-items: start; gap: 15px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .pill { display: inline-block; padding: 4px 9px; border-radius: 99px; background: #292c28; font-size: 12px; white-space: nowrap; }
    .pill.approved, .pill.fulfilled { color: var(--accent); }
    .pill.rejected, .pill.perm_rejected { color: var(--red); }
    .pill.needs_review, .pill.in_progress { color: #ffd27b; }

    .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
    .detail { min-width: 0; background: #121412; border-radius: 9px; padding: 12px; }
    .detail label, .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .detail div { overflow-wrap: anywhere; }
    .screenshot { width: 100%; max-height: 340px; object-fit: contain; background: #0b0c0b; border-radius: 10px; margin-top: 14px; }
    .checklist { display: grid; gap: 7px; padding: 0; list-style: none; }
    .checklist li { color: var(--muted); }
    .checklist li.done { color: var(--accent); }
    .reason { width: 100%; margin: 12px 0; }
    .field { display: grid; gap: 5px; margin: 12px 0; }
    .field input, .field textarea, .field select { width: 100%; }
    .empty, .notice { border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); }
    .notice.error { color: var(--red); border-color: var(--red); }
    .hidden { display: none !important; }
    .section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0; }

    @media (max-width: 760px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .details { grid-template-columns: 1fr; }
      .intro { align-items: start; flex-direction: column; }
      header { padding: 18px 20px; }
      .card { padding: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">dock<span>ed</span> / owner</div>
      <div class="subtle">Private administration</div>
    </div>
    <a href="/app.html">← Back to Docked</a>
  </header>

  <main>
    <div class="intro">
      <div>
        <h1>Owner dashboard</h1>
        <div class="subtle" id="who">Checking your access…</div>
      </div>
      <button id="refresh">↻ Refresh</button>
    </div>

    <div id="message" class="notice">Loading dashboard…</div>

    <div id="dashboard" class="hidden">
      <div class="stats">
        <div class="stat"><strong id="nPending">0</strong><span>Pending review</span></div>
        <div class="stat"><strong id="nFlagged">0</strong><span>Needs review</span></div>
        <div class="stat"><strong id="nApproved">0</strong><span>Approved</span></div>
        <div class="stat"><strong id="nRejected">0</strong><span>Rejected</span></div>
        <div class="stat"><strong id="nPrizes">0</strong><span>Open prizes</span></div>
      </div>

      <div class="tabs">
        <button class="active" data-tab="submissions">Submissions</button>
        <button data-tab="prizes">Prize fulfilment</button>
      </div>

      <section id="submissionSection">
        <div class="section-title">
          <h2>Project review queue</h2>
          <span class="subtle" id="submissionCount"></span>
        </div>
        <div class="filters">
          <input id="search" placeholder="Search title, username, project…">
          <select id="reviewFilter">
            <option value="all">All submitted projects</option>
            <option value="pending">Pending</option>
            <option value="needs_review">Needs review</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected (needs changes)</option>
            <option value="perm_rejected">Permanently rejected</option>
          </select>
        </div>
        <div id="submissions" class="list"></div>
      </section>

      <section id="prizeSection" class="hidden">
        <div class="section-title">
          <h2>Prize fulfilment</h2>
          <span class="subtle" id="prizeCount"></span>
        </div>
        <div class="filters">
          <input id="prizeSearch" placeholder="Search winner or prize…">
          <select id="prizeFilter">
            <option value="all">All orders</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In progress</option>
            <option value="fulfilled">Fulfilled</option>
          </select>
        </div>
        <div id="prizes" class="list"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let data = null;
    let busy = false;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value, location.origin);
        return ["https:", "http:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function link(value, label) {
      const url = safeUrl(value);
      return url
        ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`
        : "—";
    }

    function date(value) {
      if (!value) return "—";
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
    }

    function statusLabel(value) {
      return ({
        pending: "Pending",
        needs_review: "Needs review",
        approved: "Approved",
        rejected: "Rejected: needs changes",
        perm_rejected: "Permanently rejected",
        in_progress: "In progress",
        fulfilled: "Fulfilled"
      })[value] || value;
    }

    function pill(status) {
      return `<span class="pill ${esc(status)}">${esc(statusLabel(status))}</span>`;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || `Request failed (${response.status})`);
      return result;
    }

    function showMessage(text, error = false) {
      $("message").textContent = text;
      $("message").classList.toggle("error", error);
      $("message").classList.remove("hidden");
    }

    async function load() {
      if (busy) return;
      busy = true;
      $("refresh").disabled = true;
      showMessage("Loading dashboard…");

      try {
        data = await api("/api/owner/dashboard");
        $("who").textContent =
          `Signed in as ${data.owner.githubLogin} · GitHub ID ${data.owner.githubId}`;
        $("nPending").textContent = data.stats.pending;
        $("nFlagged").textContent = data.stats.needsReview;
        $("nApproved").textContent = data.stats.approved;
        $("nRejected").textContent = (data.stats.rejected || 0) + (data.stats.permRejected || 0);
        $("nPrizes").textContent = data.stats.pendingPrizes;
        $("dashboard").classList.remove("hidden");
        $("message").classList.add("hidden");
        renderSubmissions();
        renderPrizes();
      } catch (error) {
        $("dashboard").classList.add("hidden");
        showMessage(
          error.message.includes("Owner access only")
            ? "Access denied. This GitHub account is not on the owner allowlist."
            : error.message.includes("not configured")
              ? "Owner access is not configured. Set OWNER_GITHUB_IDS in your Render environment."
              : error.message.includes("Log in")
                ? "Please log in to Docked with your authorised GitHub account, then reopen /owner.html."
                : `Could not load dashboard: ${error.message}`,
          true
        );
      } finally {
        busy = false;
        $("refresh").disabled = false;
      }
    }

    function renderSubmissions() {
      if (!data) return;
      const query = $("search").value.trim().toLowerCase();
      const filter = $("reviewFilter").value;

      const items = data.submissions.filter((s) => {
        const status = s.reviewStatus || "pending";
        const matchesStatus = filter === "all" || status === filter;
        const text = [
          s.title, s.githubLogin, s.description, s.project,
          s.repo, s.theme, s.week
        ].join(" ").toLowerCase();
        return matchesStatus && text.includes(query);
      });

      $("submissionCount").textContent = `${items.length} shown`;
      $("submissions").innerHTML = items.length ? items.map((s) => {
        const checks = s.checklist.map((c) =>
          `<li class="${c.checked ? "done" : ""}">${c.checked ? "✓" : "○"} ${esc(c.text)}</li>`
        ).join("");

        const screenshot = safeUrl(s.screenshot);
        const status = s.reviewStatus || "pending";

        return `
          <article class="card">
            <div class="card-head">
              <div>
                <h3>${esc(s.title)}</h3>
                <div class="meta">
                  Week ${esc(s.week)} · ${esc(s.theme)} ·
                  by ${esc(s.githubLogin)} · ${esc(s.hours)} hours${s.adjusted ? ` (lowered from ${esc(s.claimedHours)})` : ""}
                </div>
              </div>
              ${pill(status)}
            </div>

            <p>${esc(s.description || "No description provided.")}</p>

            <div class="details">
              <div class="detail"><label>Playable link</label><div>${link(s.url, "Open game ↗")}</div></div>
              <div class="detail"><label>Code repository</label><div>${link(s.repo, "Open repository ↗")}</div></div>
              <div class="detail"><label>Hackatime project</label><div>${esc(s.project || "—")}</div></div>
              <div class="detail"><label>Submitted</label><div>${esc(date(s.submittedAt))}</div></div>
            </div>

            ${screenshot ? `<a href="${esc(screenshot)}" target="_blank" rel="noopener noreferrer"><img class="screenshot" src="${esc(screenshot)}" alt="Screenshot for ${esc(s.title)}"></a>` : ""}

            <div>
              <strong>Submission checklist</strong>
              <ul class="checklist">${checks || "<li>No checklist items.</li>"}</ul>
            </div>

            ${s.reviewReason ? `<p><strong>Review note:</strong> ${esc(s.reviewReason)}</p>` : ""}

            <div class="actions">
              <label>Credited hours (max ${esc(s.claimedHours)})
                <input type="number" step="0.1" min="0" max="${esc(s.claimedHours)}" value="${esc(s.hours)}"
                  style="width:90px" data-hours-for="${esc(s.userId)}:${esc(s.week)}"
                  data-current="${esc(s.hours)}" data-claimed="${esc(s.claimedHours)}">
              </label>
              <button data-review="hours" data-user="${esc(s.userId)}" data-week="${esc(s.week)}">Save hours</button>
            </div>
            <div class="actions">
              <button class="primary" data-review="approved" data-user="${esc(s.userId)}" data-week="${esc(s.week)}">Approve</button>
              <button data-review="needs_review" data-user="${esc(s.userId)}" data-week="${esc(s.week)}">Flag for review</button>
              <button class="danger" data-review="rejected" data-user="${esc(s.userId)}" data-week="${esc(s.week)}">Reject: needs changes</button>
              <button class="danger" data-review="perm_rejected" data-user="${esc(s.userId)}" data-week="${esc(s.week)}">Reject permanently</button>
            </div>
          </article>
        `;
      }).join("") : `<div class="empty">No submissions match these filters. Private drafts are not shown.</div>`;
    }

    function renderPrizes() {
      if (!data) return;
      const query = $("prizeSearch").value.trim().toLowerCase();
      const filter = $("prizeFilter").value;

      const items = data.orders.filter((o) => {
        const status = o.status || "pending";
        return (filter === "all" || status === filter) &&
          `${o.githubLogin} ${o.itemName} ${o.itemId}`.toLowerCase().includes(query);
      });

      $("prizeCount").textContent = `${items.length} shown`;
      $("prizes").innerHTML = items.length ? items.map((o) => {
        const ship = o.shipping || {};
        return `
          <article class="card" data-order="${esc(o.id)}">
            <div class="card-head">
              <div>
                <h3>${esc(o.itemName)}</h3>
                <div class="meta">Winner: ${esc(o.githubLogin)} · ${esc(o.cost)} coins · Ordered ${esc(date(o.createdAt))}</div>
              </div>
              ${pill(o.status || "pending")}
            </div>

            <div class="details">
              <div class="field"><label for="name-${esc(o.id)}">Recipient name</label><input id="name-${esc(o.id)}" value="${esc(ship.name || "")}" autocomplete="name"></div>
              <div class="field"><label for="email-${esc(o.id)}">Email</label><input id="email-${esc(o.id)}" type="email" value="${esc(ship.email || "")}" autocomplete="email"></div>
              <div class="field"><label for="contact-${esc(o.id)}">Other contact details</label><input id="contact-${esc(o.id)}" value="${esc(ship.contact || "")}"></div>
              <div class="field"><label for="address-${esc(o.id)}">Shipping address</label><textarea id="address-${esc(o.id)}" rows="3" autocomplete="street-address">${esc(ship.address || "")}</textarea></div>
            </div>

            <div class="field">
              <label for="notes-${esc(o.id)}">Fulfilment notes</label>
              <textarea id="notes-${esc(o.id)}" rows="2">${esc(o.notes || "")}</textarea>
            </div>

            <div class="field">
              <label for="status-${esc(o.id)}">Fulfilment status</label>
              <select id="status-${esc(o.id)}">
                <option value="pending" ${o.status === "pending" ? "selected" : ""}>Pending</option>
                <option value="in_progress" ${o.status === "in_progress" ? "selected" : ""}>In progress</option>
                <option value="fulfilled" ${o.status === "fulfilled" ? "selected" : ""}>Fulfilled</option>
              </select>
            </div>

            ${o.fulfilledAt ? `<p class="subtle">Fulfilled ${esc(date(o.fulfilledAt))} · GitHub ID ${esc(o.fulfilledBy || "unknown")}</p>` : ""}

            <div class="actions">
              <button class="primary" data-save-order="${esc(o.id)}">Save fulfilment details</button>
            </div>
          </article>
        `;
      }).join("") : `<div class="empty">No prize orders match these filters.</div>`;
    }

    async function review(button) {
      const action = button.dataset.review;
      const userId = button.dataset.user;
      const week = button.dataset.week;
      const input = document.querySelector(`[data-hours-for="${CSS.escape(userId + ":" + week)}"]`);
      const claimed = Number(input?.dataset.claimed);
      const current = Number(input?.dataset.current);
      const hours = Number(input?.value);
      const changed = input && input.value !== "" && Number.isFinite(hours) && Math.abs(hours - current) > 0.001;
      const lowered = changed && hours < claimed - 0.001;
      let reason = "";
      const body = {};

      if (changed) {
        if (hours < 0 || hours > claimed + 0.001) {
          alert(`Hours must be between 0 and ${claimed}.`);
          return;
        }
        body.hours = hours;
      }

      if (action === "hours") {
        if (!changed) { alert("Change the credited hours first."); return; }
      } else {
        body.status = action;
      }

      if (action === "rejected") {
        reason = prompt("Why does this project need changes? (shown to the student)") || "";
        if (!reason.trim()) return;
      } else if (action === "perm_rejected") {
        reason = prompt("Why is this project permanently rejected? (shown to the student, they cannot resubmit)") || "";
        if (!reason.trim()) return;
      } else if (action === "needs_review") {
        reason = prompt("What needs further review?") || "";
        if (!reason.trim()) return;
      } else if (lowered) {
        reason = prompt(`Why are the hours being lowered to ${hours}? (shown to the student)`) || "";
        if (!reason.trim()) return;
      } else if (action === "approved" && !confirm("Approve this project and award its eligible coins?")) {
        return;
      }

      if (reason) body.reason = reason;
      if (lowered && !reason) return;

      button.disabled = true;
      try {
        const result = await api(
          `/api/owner/submissions/${encodeURIComponent(userId)}/${encodeURIComponent(week)}/review`,
          { method: "PATCH", body: JSON.stringify(body) }
        );
        alert(action === "approved"
          ? `Approved at ${result.hours}h. Coins awarded: ${result.points}.`
          : action === "hours"
            ? `Credited hours set to ${result.hours}h.`
            : `Review status updated: ${statusLabel(result.reviewStatus)}.`);
        await load();
      } catch (error) {
        alert(error.message);
        button.disabled = false;
      }
    }

    async function saveOrder(button) {
      const id = button.dataset.saveOrder;
      const card = button.closest("[data-order]");
      if (!card) return;

      const read = (prefix) => card.querySelector(`#${prefix}-${CSS.escape(id)}`).value;

      const body = {
        status: read("status"),
        shipping: {
          name: read("name"),
          email: read("email"),
          contact: read("contact"),
          address: read("address")
        },
        notes: read("notes")
      };

      if (body.status === "fulfilled" &&
          !confirm("Mark this prize as fulfilled? This records your GitHub ID and the current time.")) {
        return;
      }

      button.disabled = true;
      try {
        await api(`/api/owner/orders/${encodeURIComponent(id)}/fulfilment`, {
          method: "PATCH",
          body: JSON.stringify(body)
        });
        alert("Prize fulfilment saved.");
        await load();
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    }

    document.addEventListener("click", (event) => {
      const reviewButton = event.target.closest("[data-review]");
      if (reviewButton) return review(reviewButton);

      const saveButton = event.target.closest("[data-save-order]");
      if (saveButton) return saveOrder(saveButton);

      const tab = event.target.closest("[data-tab]");
      if (tab) {
        document.querySelectorAll("[data-tab]").forEach((b) =>
          b.classList.toggle("active", b === tab)
        );
        $("submissionSection").classList.toggle("hidden", tab.dataset.tab !== "submissions");
        $("prizeSection").classList.toggle("hidden", tab.dataset.tab !== "prizes");
      }
    });

    $("refresh").addEventListener("click", load);
    $("search").addEventListener("input", renderSubmissions);
    $("reviewFilter").addEventListener("change", renderSubmissions);
    $("prizeSearch").addEventListener("input", renderPrizes);
    $("prizeFilter").addEventListener("change", renderPrizes);

    load();
  </script>
</body>
</html>
