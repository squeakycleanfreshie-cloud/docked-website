<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docked</title>

<style>
@font-face {
  font-family: "Nintendo DS BIOS";
  src: url("/fonts/Nintendo-DS-BIOS.ttf") format("truetype");
  font-display: swap;
}

* {
  box-sizing: border-box;
}

body {
  font: 16px/1.5 system-ui, sans-serif;
  color: #1a1a1a;
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 64px;
}

h1, h2, h3, h4, h5, h6 {
  font-family: "Nintendo DS BIOS", sans-serif;
}

h1 {
  margin: 0;
  font-size: 50px;
}

h2 {
  margin: 40px 0 12px;
  font-size: 25px;
  padding-bottom: 6px;
  border-bottom: 1px solid #ddd;
}

h3 {
  margin: 0 0 4px;
  font-size: 20px;
}

a {
  color: #c0272d;
}

section {
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 14px 16px;
  margin: 0 0 12px;
}

section.locked {
  color: #777;
  background: #fafafa;
}

button {
  font: inherit;
  padding: 6px 12px;
  border: 1px solid #1a1a1a;
  background: #fff;
  border-radius: 3px;
  cursor: pointer;
}

button.primary {
  background: #c0272d;
  border-color: #c0272d;
  color: #fff;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

input, select {
  font: inherit;
  padding: 6px 8px;
  border: 1px solid #aaa;
  border-radius: 3px;
}

input.w, select.w {
  width: 100%;
}

label.f {
  display: block;
  margin: 10px 0 2px;
  font-size: 14px;
  color: #555;
}

textarea {
  font: inherit;
  padding: 8px;
  border: 1px solid #aaa;
  border-radius: 3px;
  width: 100%;
  min-height: 90px;
  resize: vertical;
}

.muted {
  color: #777;
  font-size: 14px;
}

.bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
}

#countdown {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td {
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

td:last-child {
  text-align: right;
}

ul {
  margin: 6px 0;
  padding-left: 20px;
}

progress {
  accent-color: #c0272d;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-top: 32px;
  border-bottom: 1px solid #ddd;
}

.tabs button {
  border: 1px solid #ddd;
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  background: #fafafa;
  color: #555;
  margin-bottom: -1px;
  padding: 6px 18px;
}

.tabs button.active {
  background: #fff;
  color: #1a1a1a;
  font-weight: 600;
  border-bottom: 1px solid #fff;
}

[hidden] {
  display: none !important;
}

.check {
  display: flex;
  gap: 8px;
  margin: 6px 0;
  font-size: 14px;
  align-items: flex-start;
}

.check input {
  margin-top: 4px;
}

.thumb {
  max-width: 240px;
  max-height: 160px;
  display: block;
  margin: 6px 0;
  border: 1px solid #ddd;
}

.draft-note {
  background: #f7f7f7;
  padding: 10px 12px;
  border-radius: 4px;
  font-size: 14px;
  margin: 12px 0;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

/* Header and profile dropdown */

.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

.profile-wrap {
  position: relative;
}

.profile-button {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 12px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 4px;
}

.avatar {
  width: 32px;
  height: 32px;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: #c0272d;
  color: #fff;
  font-weight: 700;
}

.profile-menu {
  position: absolute;
  z-index: 10;
  right: 0;
  top: calc(100% + 8px);
  width: min(340px, calc(100vw - 40px));
  padding: 14px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 4px;
  box-shadow: 0 8px 24px #00000012;
}

.profile-menu table {
  font-size: 14px;
}

.profile-menu td {
  overflow-wrap: anywhere;
}

.profile-menu td:last-child {
  padding-left: 10px;
}

/* Main progress panel */

.progress-panel {
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 22px;
  margin: 20px 0 28px;
  background: #fff;
}

.progress-panel h2 {
  margin: 0 0 6px;
  padding: 0;
  border: 0;
}

.progress-row {
  margin-top: 24px;
}

.progress-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 9px;
}

.progress-heading strong {
  font-size: 17px;
}

.progress-heading span {
  color: #666;
  font-size: 14px;
}

progress.big-progress {
  display: block;
  width: 100%;
  height: 25px;
  border: 0;
  border-radius: 3px;
  overflow: hidden;
  accent-color: #c0272d;
}

progress.big-progress::-webkit-progress-bar {
  background: #f0f0f0;
}

progress.big-progress::-webkit-progress-value {
  background: #c0272d;
}

progress.big-progress::-moz-progress-bar {
  background: #c0272d;
}

.progress-foot {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 7px;
  color: #777;
  font-size: 13px;
}

.progress-empty {
  padding: 14px;
  border: 1px dashed #ddd;
  color: #777;
  font-size: 14px;
}

@media (max-width: 500px) {
  body {
    padding: 18px 12px 48px;
  }

  .progress-panel {
    padding: 16px;
  }

  .profile-button {
    padding: 5px 8px;
  }

  .site-header h1 {
    font-size: 42px;
  }
}


/* Profile picture */
.avatar {
  overflow: hidden;
  flex-shrink: 0;
}

.avatar img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

/* Shop image cards */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px;
}

.shop-card {
  border: 1px solid #ddd;
  border-radius: 5px;
  overflow: hidden;
  background: #fff;
}

.shop-card img {
  width: 100%;
  height: 150px;
  display: block;
  object-fit: cover;
  background: #f5f5f5;
}

.shop-card-content {
  padding: 12px;
}

.shop-card-content h3 {
  min-height: 44px;
}

.shop-card-content .actions {
  margin-top: 12px;
}

.profile-settings {
  border-bottom: 1px solid #eee;
  padding-bottom: 14px;
  margin-bottom: 12px;
}

.profile-settings input[type="file"] {
  width: 100%;
  font-size: 13px;
}

</style>
</head>

<body>

<header class="site-header">
  <h1>Docked</h1>

  <div class="profile-wrap">
    <button
      class="profile-button"
      id="profileButton"
      onclick="toggleProfile()"
      aria-expanded="false"
    >
      <span class="avatar" id="profileAvatar">?</span>
      <span id="profileLabel">Account</span>
      <span aria-hidden="true">⌄</span>
    </button>

    <div class="profile-menu" id="profileMenu" hidden>
      <div id="account">Loading...</div>
    </div>
  </div>
</header>

<div class="bar">
  <span id="weekLabel" class="muted"></span>
  <span id="countdown"></span>
</div>

<section class="progress-panel">
  <h2>Your progress</h2>
  <p class="muted" style="margin:0">
    Keep building. Every hour gets you closer to the finish.
  </p>

  <div id="progressOverview">
    <div class="progress-empty">Loading your progress...</div>
  </div>
</section>

<nav class="tabs">
  <button id="btn-jam" onclick="showTab('jam')">Jam</button>
  <button id="btn-shop" onclick="showTab('shop')">Shop</button>
</nav>

<div id="tab-jam">
  <h2>This week's jam</h2>
  <div id="jams"></div>
</div>

<div id="tab-shop" hidden>
  <h2>Rewards store</h2>
  <p class="muted">Your balance: <b id="shopPoints"></b></p>
  <div id="store"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const safeUrl = (u) =>
  (/^https?:\/\//.test(u || "") ? esc(u) : "#");

const fmtDate = (t) => new Date(t).toLocaleString([], {
  dateStyle: "medium",
  timeStyle: "short"
});

async function api(path, method = "GET", body) {
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  });

  const j = await r.json().catch(() => ({}));

  if (!r.ok) {
    const msg = j.error || `Server error (${r.status}). Try again in a minute.`;
    alert(msg);
    throw new Error(msg);
  }

  return j;
}

let ME = null;
let STATUS = null;
let JAMS = [];
let PROJECTS = [];
let offset = 0;
let SHOT = null;
let ITEMS = [];

// ---------- profile dropdown ----------

function toggleProfile() {
  const menu = $("profileMenu");
  const open = menu.hidden;

  menu.hidden = !open;

  $("profileButton").setAttribute(
    "aria-expanded",
    String(open)
  );
}

document.addEventListener("click", (event) => {
  if (!event.target.closest(".profile-wrap")) {
    $("profileMenu").hidden = true;

    $("profileButton").setAttribute(
      "aria-expanded",
      "false"
    );
  }
});

// ---------- countdown ----------

function tick() {
  if (!STATUS) return;

  const now = Date.now() + offset;
  let target = null;
  let label = "";

  if (STATUS.phase === "before") {
    target = STATUS.start;
    label = "Starts in ";
  } else if (STATUS.phase === "open") {
    target = STATUS.weekEnd;
    label = "Week ends in ";
  }

  if (!target) {
    $("countdown").textContent = "Challenge over";
    return;
  }

  let s = Math.max(0, Math.floor((target - now) / 1000));
  const d = Math.floor(s / 86400);
  s %= 86400;

  const h = Math.floor(s / 3600);
  s %= 3600;

  const m = Math.floor(s / 60);
  s %= 60;

  $("countdown").textContent =
    `${label}${d}d ${String(h).padStart(2, "0")}h ` +
    `${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;

  if (target - now <= 0) setTimeout(init, 1500);
}

setInterval(tick, 1000);

// ---------- account and progress ----------

function renderAccount() {
  const menu = $("account");

  if (!ME) {
    $("profileLabel").textContent = "Log in";
    $("profileAvatar").textContent = "?";

    menu.innerHTML = `
      <p class="muted">
        Sign in to track your progress and rewards.
      </p>
      <a href="/auth/github">
        <button class="primary">Log in with GitHub</button>
      </a>
    `;

    $("progressOverview").innerHTML = `
      <div class="progress-empty">
        Log in with GitHub to see your overall and weekly progress.
      </div>
    `;

    return;
  }

  const name = ME.name || ME.githubLogin || "Account";

  const avatar = ME.avatarUrl || "";

  const draftCount = (ME.submissions || []).filter(
    (s) => s.status === "draft"
  ).length;

  const goal = Number(ME.goalHours) || 100;
  const hours = Number(ME.hours) || 0;
  const percent = Math.min(100, Math.round(hours / goal * 100));

  $("profileLabel").textContent = name;
  $("profileAvatar").innerHTML = avatar
    ? `<img src="${/^\/uploads\//.test(avatar) ? esc(avatar) : safeUrl(avatar)}" alt="Profile picture">`
    : esc(name.trim().charAt(0).toUpperCase() || "?");

  // Large progress bars are the main focus of the dashboard.

  $("progressOverview").innerHTML = `
    <div class="progress-row">
      <div class="progress-heading">
        <strong>Switch 2 goal</strong>
        <span>${percent}% complete</span>
      </div>

      <progress
        class="big-progress"
        value="${Math.min(hours, goal)}"
        max="${goal}"
      ></progress>

      <div class="progress-foot">
        <span>${hours.toFixed(1)} hours logged</span>
        <span>${goal} hours goal</span>
      </div>
    </div>

    ${ME.streak ? `
      <div class="progress-row">
        <div class="progress-heading">
          <strong>This week's progress</strong>
          <span>
            ${Number(ME.streak.weekHours || 0).toFixed(1)}
            / ${Number(ME.streak.weekTarget || 0)} hours
          </span>
        </div>

        <progress
          class="big-progress"
          value="${Math.min(
            Number(ME.streak.weekHours) || 0,
            Number(ME.streak.weekTarget) || 1
          )}"
          max="${Number(ME.streak.weekTarget) || 1}"
        ></progress>

        <div class="progress-foot">
          <span>
            ${ME.streak.out
              ? `Out — log ${ME.streak.remaining} more hours to get back in`
              : "Keep up the good work!"}
          </span>
          <span>${ME.streak.freezes} streak freezes</span>
        </div>
      </div>
    ` : ""}
  `;

  // Account settings are now in the profile dropdown.

  menu.innerHTML = `

    <div class="profile-settings">
      <b>Profile settings</b>

      <label class="f" for="profileName">Display name</label>
      <input
        class="w"
        id="profileName"
        maxlength="24"
        value="${esc(name)}"
      >

      <label class="f" for="profilePicture">Profile picture</label>
      <input
        id="profilePicture"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      >

      <p class="muted">PNG, JPG or WebP. Your name and picture are saved to your account.</p>

      <button class="primary" onclick="saveProfile()">Save profile</button>
    </div>

    <table>
      <tr>
        <td>Signed in as</td>
        <td><b>${esc(name)}</b></td>
      </tr>

      <tr>
        <td>Hackatime</td>
        <td>
          ${ME.hackatimeLinked
            ? `Linked
              <div class="actions">
                <button onclick="sync()">Sync hours</button>
                <button onclick="unlink()">Unlink</button>
              </div>`
            : '<a href="/auth/hackatime">Connect Hackatime</a>'}
        </td>
      </tr>

      <tr>
        <td>Coins</td>
        <td><b>${ME.points}</b></td>
      </tr>

      <tr>
        <td>Saved drafts</td>
        <td>${draftCount}</td>
      </tr>

      <tr>
        <td>Orders</td>
        <td>
          ${(ME.orders || []).map((o) => esc(o.itemId)).join(", ") || "None"}
        </td>
      </tr>
    </table>

    ${ME.demoMode ? `
      <p class="muted">
        Demo:
        <input id="dh" type="number" value="1" style="width:70px">
        hours
        <button onclick="demoLog()">Log</button>
      </p>
    ` : ""}

    <div class="actions">
      <button onclick="logout()">Log out</button>
    </div>
  `;
}


let PROFILE_PICTURE = null;

$("profileMenu").addEventListener("change", async (event) => {
  if (event.target.id !== "profilePicture") return;

  const file = event.target.files?.[0];
  PROFILE_PICTURE = null;

  if (!file) return;

  if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
    alert("Please choose a PNG, JPG or WebP image.");
    event.target.value = "";
    return;
  }

  const img = new Image();
  const objectUrl = URL.createObjectURL(file);

  img.onload = () => {
    const scale = Math.min(1, 500 / img.width, 500 / img.height);
    const canvas = document.createElement("canvas");

    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

    PROFILE_PICTURE = canvas.toDataURL("image/jpeg", 0.82);
    URL.revokeObjectURL(objectUrl);
  };

  img.onerror = () => {
    alert("Couldn't read that image.");
    URL.revokeObjectURL(objectUrl);
  };

  img.src = objectUrl;
});

async function saveProfile() {
  try {
    const name = $("profileName").value.trim();

    if (!name || name.length > 24) {
      alert("Your display name must be 1–24 characters.");
      return;
    }

    if ($("profilePicture").files.length && !PROFILE_PICTURE) {
      alert("Your picture is still loading. Please try again in a moment.");
      return;
    }

    await api("/api/profile", "POST", {
      name,
      avatar: PROFILE_PICTURE
    });

    PROFILE_PICTURE = null;
    await init();

    $("profileMenu").hidden = false;
    $("profileButton").setAttribute("aria-expanded", "true");

    alert("Profile saved!");
  } catch (error) {
    console.error("Could not save profile:", error);
  }
}


async function logout() {
  await api("/auth/logout", "POST");
  location.reload();
}

async function unlink() {
  await api("/api/hackatime/unlink", "POST");
  await init();
}

async function sync() {
  await api("/api/sync", "POST");
  await init();
}

async function demoLog() {
  await api("/api/demo/log-hours", "POST", {
    hours: Number($("dh").value)
  });

  await init();
}

// ---------- jam form ----------

function jamForm(j, mine) {
  if (!ME) {
    return '<p class="muted">Log in to save a draft or submit.</p>';
  }

  if (!ME.hackatimeLinked && !ME.demoMode) {
    return '<p class="muted">Connect Hackatime to track project hours.</p>';
  }

  const names = PROJECTS.map((p) => p.name);

  if (mine?.project && !names.includes(mine.project)) {
    names.unshift(mine.project);
  }

  if (ME.demoMode && !names.includes("demo-project")) names.push("demo-project");

  const opts = PROJECTS.length || mine || ME.demoMode
    ? names.map((n) => {
        const p = PROJECTS.find((x) => x.name === n);

        return `<option value="${esc(n)}"
          ${mine?.project === n ? "selected" : ""}>
          ${esc(n)}${p ? ` (${p.hours}h this week)` : ""}
        </option>`;
      }).join("")
    : "";

  const checked = mine?.checklist || [];
  const isDraft = mine?.status === "draft";

  return `
    ${isDraft ? `
      <div class="draft-note">
        <b>Private draft</b><br>
        Your draft is only visible to you. Drafts earn no coins
        until you successfully submit them.
      </div>
    ` : ""}

    <label class="f">Game title</label>
    <input class="w" id="title" value="${esc(mine?.title)}">

    <label class="f">Description (30 to 1000 characters for final submission)</label>
    <textarea id="description">${esc(mine?.description)}</textarea>

    <label class="f">Playable link</label>
    <input class="w" id="url" placeholder="https://"
      value="${esc(mine?.url)}">

    <label class="f">Code link (GitHub, GitLab or similar)</label>
    <input class="w" id="repo"
      placeholder="https://github.com/you/your-game"
      value="${esc(mine?.repo)}">

    <label class="f">
      Screenshot (png, jpg or webp)
      ${mine?.screenshot ? " - leave empty to keep the current one" : ""}
    </label>

    <input type="file" id="shot"
      accept="image/png,image/jpeg,image/webp"
      onchange="pickShot(this)">

    <img id="shotPreview" class="thumb"
      ${mine?.screenshot
        ? `src="${esc(mine.screenshot)}"`
        : 'style="display:none"'}
      alt="Screenshot preview">

    <label class="f">Hackatime project</label>
    <select class="w" id="project">
      <option value="">Select a project</option>
      ${opts}
    </select>

    <div class="muted">
      Select the Hackatime project you want this jam to track.
      A final submission requires at least ${STATUS.minHours} hours.
    </div>

    ${PROJECTS.length || mine
      ? ""
      : '<div class="muted">No Hackatime projects with time logged this week yet. Start coding and refresh.</div>'}

    <label class="f">Checklist (all required for final submission)</label>

    ${STATUS.checklist.map((c) => `
      <label class="check">
        <input type="checkbox" class="ck" value="${esc(c.key)}"
          ${checked.includes(c.key) ? "checked" : ""}>
        <span>${esc(c.text)}</span>
      </label>
    `).join("")}

    <div class="actions">
      <button onclick="saveDraft(${j.week})">Save draft</button>
      <button class="primary" onclick="submitJam(${j.week})">
        ${isDraft ? "Submit draft" : mine ? "Update submission" : "Submit"}
      </button>
    </div>

    <p class="muted">
      Save a draft at any time. To publish your entry, complete the
      checklist, upload a screenshot, and reach the required hours.
    </p>
  `;
}

// ---------- render jams ----------

function renderJams() {
  const current = JAMS.filter((j) => j.state === "open");

  if (!current.length) {
    $("jams").innerHTML = `<p class="muted">${
      STATUS.phase === "before"
        ? "The first jam starts " + fmtDate(STATUS.start) + "."
        : "All jams are finished."
    }</p>`;

    return;
  }

  $("jams").innerHTML = current.map((j) => {
    const mine = ME?.submissions?.find((s) => s.week === j.week);
    const open = j.state === "open";
    const isDraft = mine?.status === "draft";
    const tag = {
      open: "Open now",
      upcoming: "Not started",
      closed: "Closed"
    }[j.state];

    return `
      <section class="${open ? "" : "locked"}">
        <div class="bar">
          <h3>Week ${j.week}: ${esc(j.theme)}</h3>
          <span class="muted">${tag}</span>
        </div>

        <div class="muted">
          ${fmtDate(j.start)} to ${fmtDate(j.end)}
        </div>

        ${mine ? `
          <div class="draft-note">
            <b>${isDraft ? "Draft saved — private" : "Submission saved"}</b><br>
            ${esc(mine.title || "Untitled project")}<br>
            Selected project hours: ${mine.hours || 0}h<br>
            ${isDraft
              ? "Coins earned from this draft: 0. It is not published."
              : `Coins earned for this entry: ${mine.points || 0}`}
          </div>
        ` : ""}

        ${open ? jamForm(j, mine) : ""}

        ${j.submissions?.length ? `
          <h3>Published submissions</h3>
          <ul>
            ${j.submissions.map((s) => `
              <li>
                ${esc(s.by)}:
                <a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">
                  ${esc(s.title)}
                </a>
                (<a href="${safeUrl(s.repo)}" target="_blank" rel="noopener noreferrer">code</a>)

                <div class="muted">${esc(s.description)}</div>

                ${s.screenshot
                  ? `<img class="thumb" src="${esc(s.screenshot)}" alt="Submission screenshot">`
                  : ""}
              </li>
            `).join("")}
          </ul>
        ` : ""}
      </section>
    `;
  }).join("");
}

// ---------- screenshot upload ----------

function pickShot(input) {
  const f = input.files[0];
  SHOT = null;

  if (!f) return;

  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) {
    alert("Use a PNG, JPG or WebP image.");
    input.value = "";
    return;
  }

  const img = new Image();

  img.onload = () => {
    const scale = Math.min(1, 1600 / img.width);
    const c = document.createElement("canvas");

    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);

    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

    SHOT = c.toDataURL("image/jpeg", 0.85);

    const pv = $("shotPreview");
    pv.src = SHOT;
    pv.style.display = "block";

    URL.revokeObjectURL(img.src);
  };

  img.onerror = () => {
    alert("Could not read that image.");
    URL.revokeObjectURL(img.src);
  };

  img.src = URL.createObjectURL(f);
}

// ---------- form payload ----------

function getJamFormData() {
  const checklist = [...document.querySelectorAll(".ck:checked")]
    .map((c) => c.value);

  return {
    title: $("title").value,
    description: $("description").value,
    url: $("url").value,
    repo: $("repo").value,
    project: $("project").value,
    checklist,
    screenshot: SHOT
  };
}

// ---------- save draft ----------

async function saveDraft(week) {
  try {
    const body = getJamFormData();

    const r = await api(`/api/jams/${week}/draft`, "POST", body);

    SHOT = null;

    alert(
      `Draft saved privately.\n\n` +
      `${r.hours} hours are recorded for your selected project.\n` +
      `Drafts earn no coins until submitted.`
    );

    await init();
  } catch (e) {
    console.error("Could not save draft:", e);
  }
}

// ---------- final submission ----------

async function submitJam(week) {
  try {
    const body = getJamFormData();

    const r = await api(`/api/jams/${week}/submit`, "POST", body);

    SHOT = null;

    alert(
      `Submission saved!\n\n` +
      `${r.hours} hours counted.\n` +
      `Your current coin balance is ${r.points}.`
    );

    await init();
  } catch (e) {
    console.error("Could not submit jam:", e);
  }
}

// ---------- store ----------

async function loadStore() {
  ITEMS = await api("/api/store");
  renderStore();
}


function renderStore() {
  const out = ME?.streak?.out;

  $("store").innerHTML =
    (out
      ? `<p>You're out, so items are locked until you log ${
          ME.streak.remaining
        } more hours. Streak freezes are still available.</p>`
      : "") +
    `<div class="shop-grid">${
      ITEMS.map((i) => {
        const image = i.image ||
          `https://placehold.co/500x300?text=${encodeURIComponent(i.name)}`;

        if (i.kind === "freeze") {
          return `
            <section class="shop-card">
              <img
                src="${esc(image)}"
                alt="${esc(i.name)}"
                loading="lazy"
              >
              <div class="shop-card-content">
                <h3>${esc(i.name)}</h3>
                <p class="muted">
                  ${i.cost} coins each. A freeze adds one hour
                  to a week you fall short.
                </p>
                <input
                  id="fq"
                  type="number"
                  min="1"
                  max="50"
                  value="1"
                  style="width:70px"
                  aria-label="Number of streak freezes"
                >
                <button onclick="buyFreeze()">Buy</button>
              </div>
            </section>`;
        }

        return `
          <section class="shop-card">
            <img
              src="${esc(image)}"
              alt="${esc(i.name)}"
              loading="lazy"
            >
            <div class="shop-card-content">
              <h3>${esc(i.name)}</h3>
              <div class="bar">
                <b>${i.cost} coins</b>
              </div>
              <div class="actions">
                <button
                  class="primary"
                  onclick="redeem('${esc(i.id)}')"
                  ${out ? "disabled" : ""}
                >
                  Redeem
                </button>
              </div>
            </div>
          </section>`;
      }).join("")
    }</div>`;
}


async function redeem(id) {
  await api("/api/store/redeem", "POST", { itemId: id });
  await init();
}

async function buyFreeze() {
  const r = await api("/api/store/redeem", "POST", {
    itemId: "freeze",
    qty: Number($("fq").value) || 1
  });

  alert(`You now have ${r.freezes} streak freeze${r.freezes === 1 ? "" : "s"}.`);
  await init();
}

// ---------- tabs ----------

function showTab(name) {
  $("tab-jam").hidden = name !== "jam";
  $("tab-shop").hidden = name !== "shop";

  $("btn-jam").classList.toggle("active", name === "jam");
  $("btn-shop").classList.toggle("active", name === "shop");

  history.replaceState(null, "", "#" + name);
}

// ---------- init ----------

async function init() {
  try {
    STATUS = await api("/api/status");
    offset = STATUS.now - Date.now();

    $("weekLabel").textContent =
      STATUS.phase === "open"
        ? `Week ${STATUS.week} of 10`
        : STATUS.phase === "before"
          ? "Not started"
          : "Finished";

    ME = await api("/api/me");

    PROJECTS = [];

    if (ME?.hackatimeLinked && STATUS.phase === "open") {
      try {
        PROJECTS = await api("/api/hackatime/projects");
      } catch (e) {
        console.error("Could not load Hackatime projects:", e);
      }
    }

    JAMS = await api("/api/jams");

    renderAccount();
    renderJams();
    renderStore();
    tick();

    $("shopPoints").textContent = ME
      ? `${ME.points} coins`
      : "Log in to see";
  } catch (e) {
    console.error("Could not load Docked:", e);
  }
}

showTab(location.hash === "#shop" ? "shop" : "jam");
init();
loadStore();
</script>
